texture_filtering_desc = "Mipmaps and smooth filtering instead of the original's sharp pixels"
anisotropic = "Anisotropic filtering"
anisotropic_desc = "Distant textures without shimmer; close-ups stay sharp (off: the original)"
msaa = "Antialiasing (MSAA)"
msaa_desc = "Smooth edges on polygons, wires, fences and trees (off: the original)"
ground_variation = "Ground variation"
ground_variation_desc = "Soft light and colour patches break up repeating ground (off: the original)"
ground_detiling = "Ground de-tiling"
ground_detiling_desc = "Ground textures without a visible tile grid (off: the original)"
texture_pack = "Texture pack"
texture_pack_desc = "Replacement 3D textures from a folder, set in config.toml"
fog = "Snow fog"
fog_desc = "Fog while it snows, as the original with FOGENABLE"
wide_weather = "Wide rain and snow"
wide_weather_desc = "Raindrops and snow over the whole width, not only the 4:3 area"
far_traffic = "Far traffic"
far_traffic_desc = "Other trains drawn up to the far edge of the view instead of 150 m"
max_lod = "Full detail"
max_lod_desc = "Track and trains in their most detailed models at every distance"
early_activation = "Early scenery"
early_activation_desc = "Scenery and side tracks appear at the far edge, not 40–200 m ahead"
draw_distance = "Draw distance"
draw_distance_desc = "How far the 3D view reaches; scenery and track are built that far"
distance_fade = "Distance fade"
distance_fade_desc = "The far edge of the view dissolves into the background"
fine_depth = "Fine depth"
fine_depth_desc = "Distant surfaces close together stay apart (off: the original's 16-bit depth)"
audio_resampler = "Resampler"
audio_resampler_desc = "How sounds reach the output rate; sinc: band-limited, no aliasing hiss"
save_on_change = "Save on change"
save_on_change_desc = "eeprom.dat written after each ranking, clear mark or options change"
save_timed_out_names = "Keep timed-out names"
save_timed_out_names_desc = "A ranking name entry that runs out of time is saved too"
keyboard_with_controller = "Keyboard with controller"
keyboard_with_controller_desc = "Horn and A / ATS confirm keys also work in controller modes"
exit_no_to_menu = "Exit \"No\" to menu"
exit_no_to_menu_desc = "\"No\" in the exit dialog returns to the title menu, not the attract"
