# 0–5, 0x49d for mode 6), 352×304 (0x49d 352×272). Each callout is a coloured box of cells; the
# regions are the cells' interiors, measured from the art. The vertical arrows between two
# words (▲▼) are kept as art, so each word is its own part above or below its arrow; a value
# part uses its whole cell (`backdrop = "solid"`), a label the original lettering's ink box.
# The words of one cell share a `group`, so they are drawn at one size (the smallest that fits
# them all); the label cells of a diagram (Brake, Power, Horn) are one group too.
# Keyboard A and B put 解除 and 非常 beside a horizontal ◆◆, so that cell is redrawn whole. The
# controller pictures (0x493–0x498, 0x4a1) and the A / B / B・C button tabs stay. A value region
# ends a row short of its arrow's tip (the tips reach into the cell; measured with
# `ddg-game label-audit`), so the arrows are not clipped.
# Keyboard A (mode 0).
0x49e = { parts = [
    { region = [26, 2, 92, 21], group = "pro", text = "Pro Mode" },          # PROモード (the Professional plate)
    { region = [26, 25, 92, 21], group = "pro", text = "On/Off" },           # ON/OFF
    { region = [174, 23, 61, 22], group = "labels", text = "Brake" },           # ブレーキ
    { region = [238, 2, 112, 68], backdrop = "solid", text = "Release\n▲▼\nEmergency" }, # 解除 ◆◆ 非常: the words sit beside the arrow, so it is redrawn (↔ is not in the bundled font)
    { region = [174, 254, 61, 22], group = "labels", text = "Power" },          # マスコン
    { region = [238, 233, 60, 24], backdrop = "solid", group = "power", text = "Off" },            # 切る ↕ (kept)
