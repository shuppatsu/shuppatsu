# Staff roll of the ending (menus.md §12.2: text tables 0x45811c full / 0x457a5c plain, one
# sprite per credit, palette 0x17, black box). Names: given name first, Hepburn with macrons
# (docs/localisation.md "Staff roll"). The credits give no furigana, so every reading comes from
# the kanji alone; the less certain ones are marked "reading?" with the alternatives. One size
# per kind across the roll (`shared_group`): the names, and the roles with the cooperation
# headers. Regions: the ink bounds from `label-audit --dump` with 2–3 px of box round them; a
# role region starts left of its lettering where the black box is free, so the English has
# room. The two centred headers are `backdrop = "solid"` so their English may use the whole row
# (a box otherwise grows only by the lettering's smaller margin). Logos and Latin art
# (電車でGO!2, STAFF, the JR mark, Stack Lab., GD, ID, GM2 HEAD, GM R&D SECT#2 0x304, TAITO
# 0x15e) stay. With `one_line_captions` the ending draws these texts itself, not the sprites
# (play/staff_roll.rs): `ending.name` parts are names, `ending.role` roles and headers, parts
# without a shared group companies and 高速編, " · " separates names in one part, `\n` role
# lines; the regions then only give the left column's position. `kanji` is a person's name as
# the art writes it (family name first, " · " between names as in `text`, checked against the
