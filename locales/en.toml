# English text for the original's text sprites (docs/localisation.md).
#
# The original draws every string as tile art from tbl.rom/cg.rom (docs/re/hud.md §4). Each entry
# below replaces the art of one sprite with our own English, rasterised into the same rectangle,
# so the arcade layout is kept. Anything not listed keeps the original art. Nothing here is drawn
# unless a language and a font are configured (DDG_LANG=en, DDG_FONT=/path/to/font.ttf).
#
# Keys
#   [tbl]          0x206 = ...       a tbl.rom tilemap id; the whole map, or `rect` (tiles)
#   [sheet.0x544]  2 = ...           descriptor index into the sheet's table in the exe
#                  name = { rect }   a named rectangle of a sheet with no known table
# Values
#   "text"                            the whole sprite; \n breaks lines; size is fitted
#   { text, align, style, vertical, outline }
#   { parts = [{ region = [x, y, w, h], text }, ...] }
#                                     replace only these pixel regions (relative to the
#                                     sprite); the rest of the art stays (gauges, digits, icons)
#   style: "auto" (default) | "plain" | "boxed"; align: "center" (default) | "left" | "right"
#   font: "body" (default) | "display" (headers, menu titles, headlines; the display font,
#         DDG_DISPLAY_FONT, or the body font when none is set)
# Colours always come from the slot's palette (the art's own colours), so palette swaps work.
#
# Comments give each sprite's role, a short Japanese label for identification, and the size in
# pixels (w×h) where it constrains the layout. Regions marked "est." were measured by eye.

[meta]
language = "en"
name = "English"

[tbl]

