# Navigator hints (hud.md §3.12): balloon 0x135 + id, 224×64. Only the inside of the balloon
# is replaced; the green border stays. Three short lines at most. Each region is the balloon's
# inside over that hint's own lettering (measured; the kanji reach from x 4 to the open right
# edge at x 223 and from y 3 to 60): the border is x 0–1 on the straight left side and rounds
# off over rows 2–12 and 51–61 (inside from x 14, 11, 9, 7, 6, 5, 5, 4, 4, 3, 3 at rows 2–12,
# mirrored below), so a region taller than the lettering would paint the corners white, and
# the old regions [6, 4, 212, 56] left the end of the lines (。 at x 218–222) and the starts at
# x 4–5 visible and sized the English from the corner pixels instead of the kanji.
# The English uses the whole balloon (user's decision): each region is the largest rectangle
# inside the rounded border that still covers that hint's lettering, with `backdrop = "solid"` so
# the text may fill it, and one size per kind (`shared_group`): the one- and two-line hints share
# one, so short hints do not blow up; the three-line hints share a smaller one.

