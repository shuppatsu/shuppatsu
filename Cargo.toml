[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
shuppatsu-formats = { path = "crates/shuppatsu-formats" }
shuppatsu-engine = { path = "crates/shuppatsu-engine" }
anyhow = "1"
thiserror = "2"
encoding_rs = "0.8"
pelite = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = "30"
winit = "0.30"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
shuppatsu-render = { path = "crates/shuppatsu-render" }
shuppatsu-audio = { path = "crates/shuppatsu-audio" }
cpal = "0.18"
gilrs = "0.11"
fontdue = "0.9"
toml = "1"
serde = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"
