[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
ddg-formats = { path = "crates/ddg-formats" }
ddg-engine = { path = "crates/ddg-engine" }
anyhow = "1"
thiserror = "2"
encoding_rs = "0.8"
pelite = "0.10"

[workspace.lints.rust]
unsafe_code = "deny"
